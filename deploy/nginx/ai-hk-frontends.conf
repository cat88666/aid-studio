# Included by the 43.154.247.11 HTTPS server. All three clients share the AID backend.
root /opt/aid-studio/current/creator-public;
index index.html;
include /etc/aid-studio/nginx-prefix.conf;

location = /aid/login { return 404; }
location ^~ /aid/system/ { return 404; }
location / { try_files $uri $uri/ @aid_public_page; }

location = /admin { return 308 /admin/$is_args$args; }
location ^~ /admin/prod-api/ {
    proxy_buffering off;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18480/;
}
location ^~ /admin/static/ { alias /opt/aid-studio/current/admin-public/static/; }
location ^~ /admin/ {
    alias /opt/aid-studio/current/admin-public/;
    try_files $uri $uri/ /admin/index.html;
}

location = /web { return 308 /web/$is_args$args; }
location ^~ /web/ {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:18481/;
    proxy_redirect ~^https?://[^/]+(/.*)$ /web$1;
}

# Preserve old bookmarks, including the nested administrator address.
location = /aid-studio { return 308 /$is_args$args; }
location ~ ^/aid-studio/(.*)$ { return 308 /$1$is_args$args; }
