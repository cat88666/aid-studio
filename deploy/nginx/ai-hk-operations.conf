location = /admin { return 308 /admin/$is_args$args; }
location ^~ /admin/prod-api/ {
    proxy_buffering off;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18480/;
}
location ^~ /admin/static/ { alias /opt/aid-studio/current/admin-public/static/; }
location ^~ /admin/ {
    alias /opt/aid-studio/current/admin-public/;
    try_files $uri $uri/ /admin/index.html;
}

location = /web { return 308 /web/$is_args$args; }
location ^~ /web/ {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:18481/;
    proxy_redirect ~^https?://[^/]+(/.*)$ /web$1;
}
