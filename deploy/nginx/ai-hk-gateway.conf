# Shared by the operations domain and legacy IP HTTPS server.
# Playground uses root-relative /v1/ requests; preserve them alongside /gateway/.
location = /gateway { return 308 /gateway/playground$is_args$args; }
location = /gateway/ { return 308 /gateway/playground$is_args$args; }
location ^~ /gateway/ {
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18090/;
}
location = /playground { return 308 https://thdrhdf.fun/gateway/playground$is_args$args; }
location ^~ /playground/ {
    proxy_pass http://127.0.0.1:18090;
}
location ^~ /v1/ {
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18090;
}
