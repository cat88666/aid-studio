# Include in the shared nginx http context alongside the existing IP server.
server {
    listen 80;
    listen [::]:80;
    server_name thdrhdf.site thdrhdf.fun;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thdrhdf.site;
    ssl_certificate /etc/letsencrypt/live/aid-studio-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aid-studio-domains/privkey.pem;
    root /opt/aid-studio/current/creator-public;
    index index.html;
    include /etc/aid-studio/nginx-prefix.conf;
    location = /aid/login { return 404; }
    location ^~ /aid/system/ { return 404; }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /web { return 404; }
    location ^~ /web/ { return 404; }
    location / { try_files $uri $uri/ @aid_public_page; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thdrhdf.fun;
    ssl_certificate /etc/letsencrypt/live/aid-studio-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aid-studio-domains/privkey.pem;
    client_max_body_size 1024m;
    proxy_read_timeout 300s;
    location = /health { proxy_pass http://127.0.0.1:18090; }
    location = /readyz { proxy_pass http://127.0.0.1:18090; }
    location = / { return 302 /admin/; }
    include /etc/aid-studio/operations-paths.conf;
    location /profile/ { proxy_pass http://127.0.0.1:18480/profile/; }
    location / { return 404; }
}
